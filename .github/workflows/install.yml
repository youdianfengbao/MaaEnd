name: install

on:
  push:
    tags:
      - "v*"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "agent/**"
      - "tools/**"

  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "agent/**"
      - "tools/**"

  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build from (branch, tag, or commit SHA). Leave blank to use default branch.'
        required: false
        type: string
        default: ''

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT

      - id: commit
        run: |
          # workflow_dispatch 指定 ref 时 github.sha 是默认分支 sha，这里取实际 checkout 的 commit
          echo "sha=$(git rev-parse HEAD)" | tee -a $GITHUB_OUTPUT

      - id: maafw-latest-release
        uses: step-security/github-action-get-latest-release@v0.8.2
        with:
          repository: MaaXYZ/MaaFramework
          excludes: "draft"
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: mxu-latest-release
        uses: step-security/github-action-get-latest-release@v0.8.2
        with:
          repository: youdianfengbao/MXU
          excludes: ${{ (steps.set_tag.outputs.is_release == 'true' && steps.set_tag.outputs.is_prerelease == 'false') && 'prerelease, draft' || 'draft' }}
          token: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
      maafw_version: ${{ steps.maafw-latest-release.outputs.release }}
      mxu_version: ${{ steps.mxu-latest-release.outputs.release }}
      commit_sha: ${{ steps.commit.outputs.sha }}

  build_and_install:
    needs: meta
    strategy:
      matrix:
        os: [win]
        arch: [x86_64]
      fail-fast: false
    runs-on: ${{ matrix.os == 'win' && 'windows-latest' || (matrix.os == 'macos' && 'macos-latest' || 'ubuntu-latest') }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          submodules: true

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build cmake

      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Setup Windows 10 SDK
        if: matrix.os == 'win'
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.5
        with:
          sdk-version: 26100

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "agent/go-service/go.mod"
          cache-dependency-path: |
            agent/go-service/go.mod
            agent/go-service/go.sum

      - name: Cache MaaDeps
        id: cache-maadeps
        uses: actions/cache@v5
        with:
          path: |
            ./agent/cpp-algo/MaaUtils/MaaDeps
          key: maadeps-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('./tools/maadeps-download.py') }}

      - name: Bootstrap MaaDeps
        if: steps.cache-maadeps.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/maadeps-download.py ${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}-${{ matrix.os == 'win' && 'windows' || (matrix.os == 'macos' && 'osx' || 'linux') }}

      - name: Setup WebView2 SDK
        if: matrix.os == 'win'
        shell: bash
        run: |
          python tools/dep_3rdparty.py --webview2

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          tag: ${{ needs.meta.outputs.maafw_version }}
          out-file-path: "deps"
          extract: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download MXU
        if: ${{ !(matrix.os == 'linux' && matrix.arch == 'aarch64') }}
        uses: robinraju/release-downloader@v1
        with:
          repository: youdianfengbao/MXU
          fileName: "*${{ matrix.os }}-${{ matrix.arch }}*"
          tag: ${{ needs.meta.outputs.mxu_version }}
          out-file-path: "downloads/MXU"
          extract: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 运行安装脚本（构建 Go Agent + Cpp Agent + 复制资源）
          python tools/build_and_install.py --cpp-algo --ci --os ${{ matrix.os }} --arch ${{ matrix.arch }} --version ${{ needs.meta.outputs.tag }}

          # 安装 MaaFramework
          echo "Install MaaFramework"
          cp -r deps/bin/* install/maafw/
          cp -r deps/share/MaaAgentBinary install/maafw/
          rm -rf install/maafw/MaaNode*

          # 安装 MXU 并重命名为 MaaEnd
          echo "Install MXU"
          if [[ -d downloads/MXU ]]; then
            rm -rf downloads/MXU*.zip downloads/MXU*.tgz
            if [[ -f downloads/MXU/mxu.exe ]]; then
              cp downloads/MXU/mxu.exe install/MaaEnd.exe
            elif [[ -f downloads/MXU/mxu ]]; then
              cp downloads/MXU/mxu install/MaaEnd
            fi
          fi

          # 合并各 resource 的 pipeline JSON 文件
          echo "Merge pipeline JSON"
          python -m pip install json5
          python tools/merge_pipeline.py install

          # 更新 interface.json（版本号 + 资源 hash）
          echo "Update interface.json: version=${{ needs.meta.outputs.tag }}, compute resource hashes"
          python -m pip install maafw
          python tools/fill_interface.py \
            --version "${{ needs.meta.outputs.tag }}" \
            --interface install/interface.json

          cat install/interface.json

      - uses: actions/upload-artifact@v6
        with:
          name: MaaEnd-${{ matrix.os }}-${{ matrix.arch }}-intermediate
          path: install

      - uses: actions/upload-artifact@v6
        with:
          name: cpp-algo-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            install/agent/cpp-algo*
            install/agent/WebView2Loader.dll
          retention-days: 90

  package_win_zip:
    needs: [meta, build_and_install]
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: MaaEnd-win-${{ matrix.arch }}-intermediate
          path: "install"

      - name: Convert PNG to ICO
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          choco install imagemagick -y
          # 为每个尺寸单独生成图像，确保 ICO 中包含独立的各尺寸图层
          for size in 512 256 128 64 48 32 24 16; do
            magick assets/locales/MaaEnd-Tiny.png -resize ${size}x${size} icon-${size}.png
          done
          magick icon-512.png icon-256.png icon-128.png icon-64.png icon-48.png icon-32.png icon-24.png icon-16.png maaend.ico

      - name: Modify MaaEnd.exe icon
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          curl -L https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -o rcedit.exe
          ./rcedit.exe "install/MaaEnd.exe" --set-icon "maaend.ico"
          echo "MaaEnd.exe icon modified successfully"

      # 调试符号仅存 Actions artifact（90 天保留，供 DMP 崩溃转储分析），不随 release 发布
      - name: Package debug symbols
        shell: pwsh
        run: |
          if (-not (Test-Path "install/agent/cpp-algo.pdb")) {
            throw "cpp-algo.pdb not found"
          }
          if (-not (Test-Path "install/agent/go-service.exe")) {
            throw "go-service.exe not found"
          }

          $symbols = "symbols"
          New-Item -ItemType Directory -Force -Path $symbols | Out-Null
          # cpp-algo PDB：与发布二进制同一次构建产出（GUID 自动配对）
          Copy-Item "install/agent/cpp-algo.pdb" "$symbols/cpp-algo.pdb" -Force
          # Go 工具链不产出 PDB：调试符号即未剥离 DWARF 的精确二进制（CI 构建不带 -s -w）
          Copy-Item "install/agent/go-service.exe" "$symbols/go-service.exe" -Force
          # 发布包仍不含 PDB（与旧行为一致）：已复制进符号包，从 install 中移除
          Remove-Item "install/agent/cpp-algo.pdb" -Force

          # go-service 版本自检：-X main.Version 注入的 tag 字符串应存在于二进制中
          $bytes = [System.IO.File]::ReadAllBytes("$symbols/go-service.exe")
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $ascii.Contains("${{ needs.meta.outputs.tag }}")) {
            throw "go-service.exe does not contain version stamp: ${{ needs.meta.outputs.tag }}"
          }

          # 符号清单：记录 tag / commit / 上游版本，便于按版本精确配对
          $manifest = [ordered]@{
            tag = "${{ needs.meta.outputs.tag }}"
            arch = "${{ matrix.arch }}"
            commit = "${{ needs.meta.outputs.commit_sha }}"
            maafw_version = "${{ needs.meta.outputs.maafw_version }}"
            mxu_version = "${{ needs.meta.outputs.mxu_version }}"
            go_service = "unstripped binary with DWARF (Go emits no PDB); resolve with go tool addr2line"
          } | ConvertTo-Json
          Set-Content -Path "$symbols/symbols-manifest.json" -Value $manifest -Encoding utf8NoBOM

          Compress-Archive -Path "symbols/*" -DestinationPath "MaaEnd-pdb-win-${{ matrix.arch }}.zip" -Force

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path install/* -DestinationPath MaaEnd-win-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v6
        with:
          name: MaaEnd-win-${{ matrix.arch }}-zip
          path: "MaaEnd-win-${{ matrix.arch }}.zip"

      # artifact 名即版本号，便于 90 天内按版本检索下载；不带 -zip 后缀，
      # 避免被 release job 的 MaaEnd-*-zip 下载 pattern 匹配（符号包不发布）
      - uses: actions/upload-artifact@v6
        with:
          name: MaaEnd-pdb-win-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}
          path: "MaaEnd-pdb-win-${{ matrix.arch }}.zip"
          retention-days: 90

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, package_win_zip, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: MaaEnd-*-zip
          path: artifacts



      - name: Prepare release artifacts
        run: |
          cd artifacts
          # 重命名 win zip 文件，添加版本号
          for f in MaaEnd-win-*-zip/MaaEnd-win-*.zip; do
            if [[ -f "$f" ]]; then
              name=$(basename "$f" .zip)
              mv "$f" "${name}-${{ needs.meta.outputs.tag }}.zip"
            fi
          done
          # 清理空目录
          rm -rf MaaEnd-*/
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          tag_name: ${{ needs.meta.outputs.tag }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

      - name: Trigger MirrorChyanUploading
        if: ${{ github.repository_owner == 'MaaEnd' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}

      - name: Send Discord release notification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY discord-release-notification.yml \
            -f release_tag="${{ needs.meta.outputs.tag }}"
